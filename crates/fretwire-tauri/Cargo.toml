[package]
name = "fretwire-tauri"
version.workspace = true
edition.workspace = true
description = "fretwire GUI on a Tauri (WebKitGTK) webview"

# The installed command (and the name the .desktop entry launches). `cargo run -p fretwire-tauri`
# still works — this only renames the produced binary.
[[bin]]
name = "fretwire-gui"
path = "src/main.rs"

[features]
# Serve the frontend from the embedded `dist/` instead of the dev server. Tauri decides this
# purely from this feature — `dev: cfg!(not(feature = "custom-protocol"))` in tauri-macros — and
# *not* from debug/release, so `cargo run --release` without it still points the webview at
# `devUrl` (http://localhost:5173) and fails with "Could not connect to localhost". The `tauri`
# CLI passes this automatically, which is why `tauri build`/`tauri dev` always worked; a plain
# `cargo run` needs it spelled out. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file/folder picker — the first-run screen needs one to locate an HX Edit installer.
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
fretwire-core = { path = "../fretwire-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
