[workspace]
resolver = "2"
members = [
    "crates/fretwire",
    "crates/fretwire-data",
    "crates/fretwire-protocol",
    "crates/fretwire-usb",
    "crates/fretwire-core",
    "crates/fretwire-cli",
    "crates/fretwire-tauri",
]
# fretwire-tauri (the GUI) is a member so it shares the lockfile, but is kept out of the default set
# so plain `cargo build`/`cargo test` (the offline suite) don't pull the whole WebKitGTK/tauri dep
# tree — and don't require the built frontend in `crates/fretwire-tauri/dist/`. Build/run it
# explicitly: `cargo run -p fretwire-tauri` (see the README for the `npm run build` step first).
default-members = [
    "crates/fretwire",
    "crates/fretwire-data",
    "crates/fretwire-protocol",
    "crates/fretwire-usb",
    "crates/fretwire-core",
    "crates/fretwire-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/john-baxter-dev/fretwire"
homepage = "https://fretwire.org"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmpv = "1"
anyhow = "1"
thiserror = "2"
# USB transport (pure-Rust libusb-free). Pinned loosely; verify latest at first build.
nusb = "0.1"
futures-lite = "2"
# Cancellable timeouts for bulk transfers (nusb 0.1 has no bulk timeout).
futures-timer = "3"
# zlib inflate for the `.hxb` backup container (pure-Rust miniz_oxide backend).
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI argument parsing. The derive API keeps `--help` generated from the command definitions
# rather than hand-maintained (it had already drifted), and makes a bad numeric argument an error
# instead of a silent default — which on `save`/`rename` meant writing to the wrong setlist.
clap = { version = "4", features = ["derive"] }
