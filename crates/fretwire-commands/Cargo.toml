[package]
name = "fretwire-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-neutral editor command layer over fretwire-core: the surface fretwire-tauri (and a future fretwire-serve) expose to the frontend."

[dependencies]
fretwire-core = { path = "../fretwire-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `spawn_blocking` only. Both consumers run on tokio — Tauri's async_runtime is one.
tokio = { workspace = true, features = ["rt"] }
# The `_inline` file commands carry binary (an IR's WAV) through JSON.
base64 = { workspace = true }

[dev-dependencies]
# The dispatch tests await the commands, so they need `#[tokio::test]`.
tokio = { workspace = true, features = ["rt", "macros"] }
